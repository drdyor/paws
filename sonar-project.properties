# SonarQube Project Properties for PawMatch

sonar.projectKey=pawmatch
sonar.projectName=PawMatch
sonar.projectVersion=1.0.0

# Source code directory
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Exclude directories
sonar.exclusions=\
  node_modules/**,\
  coverage/**,\
  dist/**,\
  build/**,\
  .expo/**,\
  .expo-shared/**,\
  assets/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

# TypeScript configuration
sonar.typescript.file.suffixes=.ts,.tsx
sonar.typescript.tsconfigPath=tsconfig.sonarqube.json
sonar.typescript.node=16

# Test coverage (if you add tests later)
# sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Code analysis settings
sonar.javascript.globals=\
  __DEV__,\
  fetch,\
  FormData,\
  navigator,\
  window,\
  document

# Ignore warnings about external configs
sonar.typescript.excludeTypeChecking=true
